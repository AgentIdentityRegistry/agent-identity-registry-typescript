name: Publish to npm

# Publishes the package when a GitHub Release is published.
# Requires repo secret NPM_TOKEN (an npm automation/granular token with
# publish rights). Provenance links the published tarball to this repo + commit.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # prepublishOnly (typecheck + test + build) runs automatically before pack.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
